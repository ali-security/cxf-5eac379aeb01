name: seal-build

# Authored for the sealed build: upstream CXF has no GitHub Actions CI.
# Mirrors BUILDING.txt (JDK 8, Maven 3.x, `mvn` runs the tests) scoped to the
# cxf-rt-transports-http module, plus the transports systests that cover the
# HTTPS hostname-verification code paths.

on:
  workflow_dispatch:
    inputs:
      test-filter:
        description: "Optional surefire -Dtest selector; empty runs the full suite"
        required: false
        default: ""

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    env:
      MAVEN_OPTS: "-Xmx3g -XX:MaxMetaspaceSize=768m"
      QA_SKIPS: "-Djava.awt.headless=true -Dmaven.javadoc.skip=true -Dcheckstyle.skip=true -Dpmd.skip=true -Dcpd.skip=true -Denforcer.skip=true -Danimal.sniffer.skip=true -Dmaven.source.skip=true -Dgpg.skip=true -Drat.skip=true"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "8"

      - name: Install Maven 3.9.5
        run: |
          curl -sSfL https://archive.apache.org/dist/maven/maven-3/3.9.5/binaries/apache-maven-3.9.5-bin.tar.gz | tar xz -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/apache-maven-3.9.5/bin" >> "$GITHUB_PATH"

      - name: Build (install module and test dependencies, no tests)
        run: |
          mvn -v
          mvn -B -e --no-transfer-progress clean install \
            -pl rt/transports/http,systests/transports -am -DskipTests -Dinvoker.skip=true $QA_SKIPS

      - name: Test cxf-rt-transports-http
        run: |
          if [ -n "${{ inputs.test-filter }}" ]; then
            mvn -B -e --no-transfer-progress test -pl rt/transports/http \
              -Dtest='${{ inputs.test-filter }}' -DfailIfNoTests=false $QA_SKIPS
          else
            mvn -B -e --no-transfer-progress test -pl rt/transports/http $QA_SKIPS
          fi

      - name: Test HTTPS hostname verification systests
        if: ${{ inputs.test-filter == '' }}
        run: |
          mvn -B -e --no-transfer-progress test -pl systests/transports \
            -Dtest='org.apache.cxf.systest.https.hostname.*Test' -DfailIfNoTests=false $QA_SKIPS

      - name: Report skipped tests
        if: always()
        run: |
          # For every skipped testcase, print the test and the annotation in the
          # test source that disabled it (the reason surefire does not print).
          found=0
          for f in rt/transports/http/target/surefire-reports/TEST-*.xml systests/transports/target/surefire-reports/TEST-*.xml; do
            [ -f "$f" ] || continue
            grep -B1 "<skipped" "$f" | grep -o 'testcase name="[^"]*" classname="[^"]*"' | while read -r line; do
              name=$(echo "$line" | sed 's/testcase name="\([^"]*\)".*/\1/')
              cls=$(echo "$line" | sed 's/.*classname="\([^"]*\)"/\1/')
              src=$(find rt/transports/http/src/test systests/transports/src/test -path "*/$(echo "$cls" | tr . /).java" | head -1)
              echo "SKIPPED: $cls.$name"
              echo "  reason: disabled upstream in $src by:"
              grep -n -B3 "void $name(" "$src" | grep -i "ignore\|assume" | sed 's/^/    /'
            done
            found=1
          done
          [ "$found" = 1 ] || echo "No surefire reports found"

      - uses: actions/upload-artifact@v4
        with:
          name: cxf-rt-transports-http
          path: |
            rt/transports/http/target/cxf-rt-transports-http-*.jar
            !rt/transports/http/target/*-tests.jar
            !rt/transports/http/target/*-sources.jar
            !rt/transports/http/target/*-javadoc.jar
          if-no-files-found: error
